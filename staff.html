<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daivik Staff GPS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Poppins,Arial;background:#071629;color:#fff;margin:0}.wrap{max-width:600px;margin:auto;padding:25px}.card{background:#102b49;border:1px solid #31516f;border-radius:20px;padding:22px;margin-bottom:18px}h1{color:#d4af37}input{width:100%;padding:13px;margin:7px 0 12px;box-sizing:border-box;border-radius:10px;border:1px solid #49657e;background:#081b30;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#fff;font-weight:bold}.muted{color:#aebbd0;font-size:13px}.live{color:#8ff0b8;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><h1>📍 Daivik Staff GPS</h1><p class="muted">Enter the customer's Order ID, then allow location access. Keep this page open while travelling.</p><label>Order ID</label><input id="oid" placeholder="ORD..."><button class="btn" onclick="start()">Start Live Location</button><p id="msg" class="muted"></p></div><div class="card"><p>Status: <span id="status" class="live">Waiting</span></p><p id="coords" class="muted">GPS coordinates will appear here.</p></div></div><script>const db=supabase.createClient("https://holelzxzhaiefaqezmce.supabase.co","sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ");let oid="",watch=null,last=0;async function start(){oid=document.getElementById("oid").value.trim();if(!oid){document.getElementById("msg").textContent="Enter Order ID.";return}const {data,error}=await db.from("daivik_car_wash_orders").select("order_id").eq("order_id",oid).maybeSingle();if(error||!data){document.getElementById("msg").textContent="Order not found.";return}if(!navigator.geolocation){document.getElementById("msg").textContent="GPS is not supported on this device.";return}document.getElementById("status").textContent="Requesting GPS…";watch=navigator.geolocation.watchPosition(sendPosition,e=>{document.getElementById("status").textContent="GPS error: "+e.message},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});}async function sendPosition(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude;document.getElementById("status").textContent="LIVE • GPS sharing";document.getElementById("coords").textContent="Lat: "+lat.toFixed(6)+" • Lng: "+lng.toFixed(6);const now=Date.now();if(now-last<4000)return;last=now;const {error}=await db.from("daivik_car_wash_orders").update({staff_lat:lat,staff_lng:lng,updated_at:new Date().toISOString()}).eq("order_id",oid);if(error)document.getElementById("msg").textContent=error.message;else document.getElementById("msg").textContent="Location sent to customer ✓";}</script></body></html>
