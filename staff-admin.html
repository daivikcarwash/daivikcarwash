<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daivik Staff Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#071629;color:#fff;margin:0}.wrap{max-width:800px;margin:auto;padding:18px}.card{background:#102b49;border:1px solid #31516f;border-radius:18px;padding:18px;margin-bottom:15px}h1,h2{color:#d4af37}input,select{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #31516f;background:#071629;color:#fff;margin:5px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:11px 14px;border:0;border-radius:9px;background:#d4af37;color:#fff;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.staff{padding:13px;border:1px solid #294863;border-radius:12px;margin:8px 0}.muted{color:#aebbd0;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>👥 Staff Management</h1><p class="muted">Add wash boys and manage active/inactive status. Orders can then be assigned to a staff member.</p><div class="grid"><div><label>Name</label><input id="name" placeholder="Staff name"></div><div><label>Mobile</label><input id="mobile" inputmode="numeric" placeholder="10-digit mobile"></div></div><div class="row"><button class="btn" onclick="addStaff()">+ Add Staff</button><button class="btn" onclick="load()">Refresh</button></div><p id="msg" class="muted"></p></div><div class="card"><h2>Staff List</h2><div id="list">Loading...</div></div></div><script>const db=supabase.createClient("https://rgjymvvtrmzhznnreqog.supabase.co","sb_publishable_va_23GihM7LMOg7J5Lsjng_TQAUGCzY");let rows=[];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){const r=await db.from("daivik_staff").select("*").order("name");if(r.error){msg.textContent=r.error.message;return}rows=r.data||[];list.innerHTML=rows.map(s=>'<div class="staff"><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.mobile||"No mobile")+' • '+esc(s.role)+' • '+esc(s.status)+'</div><div class="row" style="margin-top:8px"><button class="btn" onclick="toggleStatus(\''+s.id+'\',\''+s.status+'\')">'+(s.status==="Active"?"Set Inactive":"Set Active")+'</button></div></div>').join("")||'<p class="muted">No staff yet.</p>'}async function addStaff(){const n=name.value.trim(),m=mobile.value.trim();if(!n){msg.textContent="Enter staff name.";return}const r=await db.from("daivik_staff").insert({name:n,mobile:m||null,role:"wash_boy",status:"Active"});if(r.error){msg.textContent="Add failed: "+r.error.message;return}name.value="";mobile.value="";msg.textContent="Staff added ✓";load()}async function toggleStatus(id,status){const r=await db.from("daivik_staff").update({status:status==="Active"?"Inactive":"Active",updated_at:new Date().toISOString()}).eq("id",id);if(r.error){msg.textContent=r.error.message;return}load()}load();</script></body></html>
