<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daivik Operations</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#071629;color:#fff;margin:0}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#102b49;border:1px solid #31516f;border-radius:18px;padding:16px;margin-bottom:14px}h1,h2{color:#d4af37}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select{background:#071629;color:#fff;border:1px solid #31516f;border-radius:8px;padding:9px}.btn{padding:10px 13px;border:0;border-radius:8px;background:#d4af37;color:#fff;font-weight:bold}.job{background:#0b2037;border:1px solid #294863;border-radius:13px;padding:13px;margin:9px 0}.muted{color:#aebbd0;font-size:12px}.tag{padding:4px 8px;border-radius:15px;background:#173a59;color:#d4af37;font-size:11px}</style></head><body><div class="wrap"><div class="card"><h1>⚙️ Daivik Operations</h1><p class="muted">Admin dispatch board: assign new bookings to a wash boy. Assigned jobs appear automatically in the Staff App.</p><div class="row"><button class="btn" onclick="loadAll()">↻ Refresh</button><a class="btn" href="staff-admin.html" style="text-decoration:none">Manage Staff</a><a class="btn" href="owner.html" style="text-decoration:none">Owner Dashboard</a></div><p id="msg" class="muted"></p></div><div class="card"><h2>Dispatch Queue</h2><div id="jobs">Loading...</div></div></div><script>const db=supabase.createClient("https://holelzxzhaiefaqezmce.supabase.co","sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ");let staff=[];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function loadAll(){const s=await db.from("daivik_staff").select("*").eq("status","Active").order("name");if(s.error){msg.textContent=s.error.message;return}staff=s.data||[];const r=await db.from("daivik_car_wash_orders").select("*").not("status","in","(Completed,Cancelled)").order("service_date").order("created_at",{ascending:false});if(r.error){msg.textContent=r.error.message;return}render(r.data||[]);msg.textContent="Dispatch board updated ✓"}function render(rows){jobs.innerHTML=rows.length?rows.map(o=>'<div class="job"><b>'+esc(o.order_id)+'</b> <span class="tag">'+esc(o.status)+'</span><div style="margin-top:5px">'+esc(o.customer_name)+' • '+esc(o.customer_mobile)+'</div><div class="muted">'+esc(o.vehicle)+' • '+esc(o.service)+' • ₹'+esc(o.price)+'</div><div class="muted">📅 '+esc(o.service_date)+' • '+esc(o.preferred_time||"")+'</div><div class="muted">📍 '+esc(o.address)+'</div><div class="row" style="margin-top:9px"><select data-id="'+esc(o.order_id)+'" onchange="assign(this.dataset.id,this.value)"><option value="">Unassigned</option>'+staff.map(s=>'<option value="'+esc(s.id)+'" '+(o.assigned_staff_id===s.id?"selected":"")+'>'+esc(s.name)+'</option>').join("")+'</select><button class="btn" onclick="setStatus(\''+o.order_id+'\',\'Confirmed\')">Confirm</button></div></div>').join(""):'<p class="muted">No active bookings in queue.</p>'}async function assign(id,staffId){const r=await db.from("daivik_car_wash_orders").update({assigned_staff_id:staffId||null,updated_at:new Date().toISOString()}).eq("order_id",id);if(r.error){alert(r.error.message);return}msg.textContent=staffId?"Assigned ✓":"Unassigned";loadAll()}async function setStatus(id,status){const r=await db.from("daivik_car_wash_orders").update({status,updated_at:new Date().toISOString()}).eq("order_id",id);if(r.error){alert(r.error.message);return}loadAll()}loadAll();setInterval(loadAll,10000);</script></body></html>
