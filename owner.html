<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daivik Owner Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#071629;color:#fff;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#102b49;border:1px solid #31516f;border-radius:18px;padding:20px;margin-bottom:18px}h1{color:#d4af37}input,select{padding:11px;border-radius:9px;border:1px solid #49657e;background:#081b30;color:#fff}.btn{padding:11px 16px;border:0;border-radius:9px;background:#d4af37;color:#fff;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b2037;padding:16px;border-radius:12px}.stat b{display:block;font-size:24px;color:#d4af37;margin-top:5px}.order{background:#0b2037;border:1px solid #294863;border-radius:14px;padding:15px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#aebbd0;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><h1>🚗 Daivik Owner Dashboard</h1><p class="muted">Supabase-connected booking management.</p><div class="row"><input id="pin" type="password" placeholder="Owner PIN"><button class="btn" onclick="login()">Open Dashboard</button></div><p id="msg" class="muted"></p></div><div id="app" style="display:none"><div class="grid"><div class="stat">Orders<b id="total">0</b></div><div class="stat">Received<b id="received">0</b></div><div class="stat">On Way<b id="onway">0</b></div><div class="stat">Completed<b id="done">0</b></div></div><div class="card"><div class="row"><select id="filter" onchange="render()"><option value="ALL">All Orders</option><option>Booking Received</option><option>Confirmed</option><option>On the Way</option><option>Arriving Soon</option><option>Completed</option><option>Cancelled</option></select><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" onclick="exportCSV()">⬇ Export</button></div><div id="orders"></div></div></div></div><script>const SUPABASE_URL="https://holelzxzhaiefaqezmce.supabase.co",KEY="sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ",db=supabase.createClient(SUPABASE_URL,KEY);let orders=[];const OWNER_PIN="7906199445";function login(){if(document.getElementById("pin").value!==OWNER_PIN){document.getElementById("msg").textContent="Invalid owner PIN.";return}document.getElementById("app").style.display="block";document.getElementById("msg").textContent="Dashboard connected ✓";load()}async function load(){const {data,error}=await db.from("daivik_car_wash_orders").select("*").order("created_at",{ascending:false});if(error){document.getElementById("msg").textContent=error.message;return}orders=data||[];render();subscribe()}function render(){let f=document.getElementById("filter").value;let a=f==="ALL"?orders:orders.filter(o=>o.status===f);document.getElementById("total").textContent=orders.length;document.getElementById("received").textContent=orders.filter(o=>o.status==="Booking Received").length;document.getElementById("onway").textContent=orders.filter(o=>o.status==="On the Way"||o.status==="Arriving Soon").length;document.getElementById("done").textContent=orders.filter(o=>o.status==="Completed").length;document.getElementById("orders").innerHTML=a.map(o=>`<div class="order"><b>${o.order_id}</b> — ${o.service} — ₹${o.price}<br><span class="muted">${o.customer_name} • ${o.customer_mobile} • ${o.customer_email}<br>${o.vehicle} • ${o.service_date} • ${o.preferred_time}<br>${o.address}</span><div class="row" style="margin-top:10px"><select onchange="setStatus('${o.order_id}',this.value)"><option ${o.status==="Booking Received"?"selected":""}>Booking Received</option><option ${o.status==="Confirmed"?"selected":""}>Confirmed</option><option ${o.status==="On the Way"?"selected":""}>On the Way</option><option ${o.status==="Arriving Soon"?"selected":""}>Arriving Soon</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select><span class="muted">Payment: ${o.payment_status}</span><br><button class="btn" style="margin-top:8px" data-id="${o.order_id}" onclick="editOrder(this.dataset.id)">✏️ Edit</button> <button class="btn" style="margin-top:8px;background:#a83232" data-id="${o.order_id}" onclick="deleteOrder(this.dataset.id)">🗑 Delete</button></div></div>`).join("")||"<p class='muted'>No orders found.</p>"}async function deleteOrder(id){if(!confirm("Delete order "+id+" permanently?"))return;const r=await db.from("daivik_car_wash_orders").delete().eq("order_id",id);if(r.error)alert(r.error.message);else{orders=orders.filter(o=>o.order_id!==id);render()}} async function editOrder(id){const o=orders.find(x=>x.order_id===id);if(!o)return;const name=prompt("Customer name",o.customer_name);if(name===null)return;const mobile=prompt("Mobile",o.customer_mobile);if(mobile===null)return;const vehicle=prompt("Vehicle",o.vehicle);if(vehicle===null)return;const address=prompt("Address",o.address);if(address===null)return;const r=await db.from("daivik_car_wash_orders").update({customer_name:name,customer_mobile:mobile,vehicle,address,updated_at:new Date().toISOString()}).eq("order_id",id).select().maybeSingle();if(r.error)alert(r.error.message);else{const i=orders.findIndex(x=>x.order_id===id);if(i>=0)orders[i]=r.data;render()}} function exportCSV(){const rows=[["Order ID","Name","Email","Mobile","Vehicle","Service","Price","Date","Time","Status","Payment","Address"]].concat(orders.map(o=>[o.order_id,o.customer_name,o.customer_email,o.customer_mobile,o.vehicle,o.service,o.price,o.service_date,o.preferred_time,o.status,o.payment_status,o.address]));const csv=rows.map(r=>r.map(x=>"""+String(x??"").replaceAll(""","""")+""").join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daivik-orders.csv";a.click()} async function setStatus(id,status){const {error}=await db.from("daivik_car_wash_orders").update({status,updated_at:new Date().toISOString()}).eq("order_id",id);if(error)alert(error.message);else{const o=orders.find(x=>x.order_id===id);if(o)o.status=status;render()}}function subscribe(){db.channel("owner-orders").on("postgres_changes",{event:"*",schema:"public",table:"daivik_car_wash_orders"},payload=>{load()}).subscribe()}</script></body></html>
