<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daivik Owner Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#071629;color:#fff;margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#102b49;border:1px solid #31516f;border-radius:18px;padding:20px;margin-bottom:18px}h1{color:#d4af37;margin-top:0}input,select{padding:11px;border-radius:9px;border:1px solid #49657e;background:#081b30;color:#fff}.btn{padding:11px 16px;border:0;border-radius:9px;background:#d4af37;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#a83232}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b2037;padding:16px;border-radius:12px}.stat b{display:block;font-size:24px;color:#d4af37;margin-top:5px}.order{background:#0b2037;border:1px solid #294863;border-radius:14px;padding:15px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#aebbd0;font-size:13px}.error{color:#ff8585}.ok{color:#8ff0a4}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🚗 Daivik Owner Dashboard</h1>
<p class="muted">All booking orders • Edit • Delete • Status • Export</p>
<div class="row">
<input id="pin" type="password" inputmode="numeric" placeholder="Owner PIN" onkeydown="if(event.key==='Enter')login()">
<button class="btn" onclick="login()">Open Dashboard</button>
</div>
<p id="msg" class="muted"></p>
</div>

<div id="app" style="display:none">
<div class="grid">
<div class="stat">Orders<b id="total">0</b></div>
<div class="stat">Received<b id="received">0</b></div>
<div class="stat">On Way<b id="onway">0</b></div>
<div class="stat">Completed<b id="done">0</b></div>
</div>

<div class="card">
<div class="row">
<select id="filter" onchange="render()">
<option value="ALL">All Orders</option><option>Booking Received</option><option>Confirmed</option><option>On the Way</option><option>Arriving Soon</option><option>Completed</option><option>Cancelled</option>
</select>
<button class="btn" onclick="loadOrders()">↻ Refresh</button>
<button class="btn" onclick="exportCSV()">⬇ Export CSV</button>
</div>
<div id="orders"></div>
</div>
</div>
</div>

<script>
const OWNER_PIN="7906199445";
let db=null,orders=[],channelStarted=false;

async function initDB(){
  if(db)return true;
  try{
    const html=await fetch("customer.html",{cache:"no-store"}).then(r=>r.text());
    const m=html.match(/const\s+SUPABASE_KEY\s*=\s*["']([^"']+)["']/);
    const u=html.match(/const\s+SUPABASE_URL\s*=\s*["']([^"']+)["']/);
    if(!m||!u)throw new Error("Supabase configuration not found.");
    db=supabase.createClient(u[1],m[1]);
    return true;
  }catch(e){
    setMsg("Could not connect to Supabase: "+e.message,true);
    return false;
  }
}
function setMsg(t,error=false){const el=document.getElementById("msg");el.textContent=t;el.className="muted "+(error?"error":"ok")}
async function login(){
  if(document.getElementById("pin").value!==OWNER_PIN){setMsg("Invalid owner PIN.",true);return}
  document.getElementById("app").style.display="block";
  setMsg("Dashboard connected ✓ Loading orders...");
  await loadOrders();
}
async function loadOrders(){
  if(!(await initDB()))return;
  const {data,error}=await db.from("daivik_car_wash_orders").select("*").order("created_at",{ascending:false});
  if(error){setMsg("Supabase error: "+error.message,true);return}
  orders=data||[];render();setMsg("Dashboard connected ✓ "+orders.length+" order(s) loaded");
  if(!channelStarted)subscribe();
}
function render(){
  const f=document.getElementById("filter").value;
  const list=f==="ALL"?orders:orders.filter(o=>o.status===f);
  document.getElementById("total").textContent=orders.length;
  document.getElementById("received").textContent=orders.filter(o=>o.status==="Booking Received").length;
  document.getElementById("onway").textContent=orders.filter(o=>o.status==="On the Way"||o.status==="Arriving Soon").length;
  document.getElementById("done").textContent=orders.filter(o=>o.status==="Completed").length;
  document.getElementById("orders").innerHTML=list.map(o=>`
    <div class="order">
      <b>${esc(o.order_id)}</b> — ${esc(o.service)} — ₹${esc(o.price)}
      <br><span class="muted">${esc(o.customer_name)} • ${esc(o.customer_mobile)} • ${esc(o.customer_email)}
      <br>${esc(o.vehicle)} • ${esc(o.service_date)} • ${esc(o.preferred_time||"")}
      <br>${esc(o.address)}</span>
      <div class="row" style="margin-top:10px">
        <select data-id="${esc(o.order_id)}" onchange="setStatus(this.dataset.id,this.value)">
          <option ${o.status==="Booking Received"?"selected":""}>Booking Received</option>
          <option ${o.status==="Confirmed"?"selected":""}>Confirmed</option>
          <option ${o.status==="On the Way"?"selected":""}>On the Way</option>
          <option ${o.status==="Arriving Soon"?"selected":""}>Arriving Soon</option>
          <option ${o.status==="Completed"?"selected":""}>Completed</option>
          <option ${o.status==="Cancelled"?"selected":""}>Cancelled</option>
        </select>
        <span class="muted">Payment: ${esc(o.payment_status||"Pending")}</span>
        <button class="btn" data-id="${esc(o.order_id)}" onclick="editOrder(this.dataset.id)">✏️ Edit</button>
        <button class="btn danger" data-id="${esc(o.order_id)}" onclick="deleteOrder(this.dataset.id)">🗑 Delete</button>
      </div>
    </div>`).join("")||"<p class='muted'>No orders found.</p>";
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function setStatus(id,status){
  const {error}=await db.from("daivik_car_wash_orders").update({status,updated_at:new Date().toISOString()}).eq("order_id",id);
  if(error){alert("Status update failed: "+error.message);return}
  const o=orders.find(x=>x.order_id===id);if(o)o.status=status;render();
}
async function editOrder(id){
  const o=orders.find(x=>x.order_id===id);if(!o)return;
  const name=prompt("Customer name",o.customer_name);if(name===null)return;
  const mobile=prompt("Mobile",o.customer_mobile);if(mobile===null)return;
  const vehicle=prompt("Vehicle",o.vehicle);if(vehicle===null)return;
  const address=prompt("Address",o.address);if(address===null)return;
  const {data,error}=await db.from("daivik_car_wash_orders").update({customer_name:name,customer_mobile:mobile,vehicle,address,updated_at:new Date().toISOString()}).eq("order_id",id).select().maybeSingle();
  if(error){alert("Edit failed: "+error.message);return}
  const i=orders.findIndex(x=>x.order_id===id);if(i>=0&&data)orders[i]=data;render();
}
async function deleteOrder(id){
  if(!confirm("Delete order "+id+" permanently?"))return;
  const {error}=await db.from("daivik_car_wash_orders").delete().eq("order_id",id);
  if(error){alert("Delete failed: "+error.message);return}
  orders=orders.filter(o=>o.order_id!==id);render();
}
function exportCSV(){
  const rows=[["Order ID","Name","Email","Mobile","Vehicle","Service","Price","Date","Time","Status","Payment","Address"]].concat(orders.map(o=>[o.order_id,o.customer_name,o.customer_email,o.customer_mobile,o.vehicle,o.service,o.price,o.service_date,o.preferred_time,o.status,o.payment_status,o.address]));
  const csv=rows.map(r=>r.map(x=>JSON.stringify(String(x??""))).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=window.URL.createObjectURL(blob);a.download="daivik-orders.csv";document.body.appendChild(a);a.click();a.remove();
}
function subscribe(){
  channelStarted=true;
  db.channel("owner-orders").on("postgres_changes",{event:"*",schema:"public",table:"daivik_car_wash_orders"},()=>loadOrders()).subscribe();
}
</script>
</body>
</html>
