<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Monthly Booking | Daivik Doorstep Car Wash</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#D4AF37;--bg:#061326;--bg2:#102f50;--muted:#aebbd0;--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.15)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
body{min-height:100vh;color:#fff;background:linear-gradient(135deg,var(--bg),var(--bg2));padding-bottom:50px}
.top{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,18,37,.92);border-bottom:1px solid var(--border)}
.brand{font:700 23px "Playfair Display";color:var(--gold)}.back{color:#fff;text-decoration:none;border:1px solid var(--gold);padding:8px 15px;border-radius:22px;font-size:13px}
.wrap{width:min(850px,94%);margin:35px auto}.hero{text-align:center;margin-bottom:22px}.hero h1{font:700 38px "Playfair Display";color:var(--gold)}.hero p{color:var(--muted);margin-top:7px}
.card{background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:25px;box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(18px)}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.25);color:#fff;outline:none}input:focus{border-color:var(--gold)}
.btn{width:100%;border:0;border-radius:13px;padding:14px;margin-top:17px;background:linear-gradient(135deg,var(--gold),#B8962E);color:#fff;font-weight:700;font-size:15px}.btn:disabled{opacity:.7}
.msg{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}.success{margin-top:20px;padding:20px;border:1px solid rgba(83,214,143,.35);background:rgba(83,214,143,.08);border-radius:18px}.success h2{color:#8ff0b8;font-size:21px}
.summary{margin-top:14px;padding:15px;border-radius:15px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.25)}.schedule{display:grid;gap:9px;margin-top:10px}.day{padding:13px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--border)}.day b{color:var(--gold)}.muted{color:var(--muted);font-size:12px}
@media(max-width:650px){.hero h1{font-size:30px}.card{padding:20px}.brand{font-size:20px}.back{font-size:12px;padding:8px 12px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Daivik Doorstep Car Wash</div><a class="back" href="monthly.html">← Monthly Plans</a></header>
<main class="wrap">
<section class="hero"><h1>📦 My Monthly Booking</h1><p>Check your recent monthly packages and service schedules anytime.</p></section>
<section class="card">
<label>Order ID <span class="muted">(optional)</span></label>
<input id="orderId" autocomplete="off" placeholder="Enter Order ID">
<label>Email Address <span class="muted">(optional)</span></label>
<input id="email" type="email" autocomplete="email" placeholder="Enter booking email">
<button id="findBtn" class="btn" onclick="findMonthly()">🔎 Find My Booking</button>
<p class="muted" style="text-align:center;margin-top:9px">Only one is needed — Order ID or Email Address.</p>
<p id="msg" class="msg"></p>
<div id="result"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://holelzxzhaiefaqezmce.supabase.co";
const SUPABASE_KEY="sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function dateText(v){
  if(!v)return "Date not available";
  return new Date(v+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
}
function setMessage(text){$("msg").textContent=text;}

async function findMonthly(){
  const id=$("orderId").value.trim();
  const email=$("email").value.trim().toLowerCase();
  const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!id&&!emailOk){setMessage("Enter your Order ID or Email Address.");return;}

  $("findBtn").disabled=true;
  setMessage("Finding your booking…");
  $("result").innerHTML="";

  try{
    let data=[],error=null;

    // If Order ID is supplied, use it first. If it does not match, fall back to email.
    if(id){
      const r=await db.from("daivik_monthly_orders").select("*").eq("order_id",id).order("created_at",{ascending:false}).limit(5);
      data=r.data||[]; error=r.error;
      if(!error && !data.length && emailOk){
        const r2=await db.from("daivik_monthly_orders").select("*").eq("customer_email",email).order("created_at",{ascending:false});
        data=r2.data||[]; error=r2.error;
      }
    }else{
      const r=await db.from("daivik_monthly_orders").select("*").eq("customer_email",email).order("created_at",{ascending:false});
      data=r.data||[]; error=r.error;
    }

    if(error)throw error;
    if(!data.length){
      setMessage("No monthly booking found. Please check your Order ID or Email Address.");
      return;
    }

    let html="<div class='success'><h2>✓ Monthly Booking Found</h2>";
    data.forEach((row,ri)=>{
      const schedule=Array.isArray(row.schedule)?row.schedule:[];
      html+="<div class='summary' style='margin-top:"+(ri?"14px":"10px")+"'>"+
        "<p><b>"+esc(row.package_name)+"</b></p>"+
        "<p style='margin-top:5px'><b>Order ID:</b> "+esc(row.order_id)+"</p>"+
        "<p style='margin-top:5px'><b>Status:</b> "+esc(row.status)+"</p>"+
        "<p style='margin-top:5px'><b>Payment:</b> "+esc(row.payment_status)+"</p>"+
        "<div style='margin-top:12px'><b>📅 Service Schedule</b><div class='schedule'>"+
        schedule.map((s,i)=>"<div class='day'><b>Service "+(i+1)+"</b><br>"+dateText(s.date)+" • "+esc(s.time||row.service_time||"")+"</div>").join("")+
        "</div></div></div>";
    });
    html+="<p class='muted' style='margin-top:12px'>Your recent monthly bookings are shown for this email. Keep your Order IDs for future reference.</p></div>";
    $("result").innerHTML=html;
    setMessage(data.length+" monthly booking"+(data.length>1?"s":"")+" found ✓");
    localStorage.setItem("daivikMonthlyLookup",JSON.stringify({orderId:id,email}));
  }catch(e){
    console.error(e);
    setMessage("Unable to load booking right now. Please try again.");
  }finally{
    $("findBtn").disabled=false;
  }
}

window.addEventListener("DOMContentLoaded",()=>{
  try{
    const saved=JSON.parse(localStorage.getItem("daivikMonthlyLookup")||"null");
    const params=new URLSearchParams(location.search);
    const order=params.get("order")||saved?.orderId||"";
    const email=params.get("email")||saved?.email||"";
    if(order)$("orderId").value=order;
    if(email)$("email").value=email;
    if(order||email)setTimeout(findMonthly,250);
  }catch(e){}
});
</script>
</body>
</html>
