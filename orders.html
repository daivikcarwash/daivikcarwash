<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071629"><title>My Washes • Daivik</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#061326;color:#fff;font-family:Poppins,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:14px 14px 90px}.top{position:sticky;top:0;z-index:5;background:rgba(5,18,37,.96);padding:18px 14px;border-bottom:1px solid #31516f}.brand{font-weight:800;color:#d4af37;font-size:21px}.card{background:#102b49;border:1px solid #31516f;border-radius:20px;padding:18px;margin:14px 0}.hero{background:linear-gradient(135deg,#123b60,#10233b)}h1{margin:0 0 8px;font-size:30px}.muted{color:#aebbd0;font-size:14px;line-height:1.45}.item{padding:15px;border:1px solid #31516f;border-radius:14px;margin:10px 0;background:#0b2037}.gold{color:#d4af37}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;border:0;border-radius:11px;padding:11px 15px;background:#d4af37;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.btn.blue{background:#274a68}.btn.red{background:#a63b3b}.nav{position:fixed;bottom:0;left:0;right:0;background:#071629;border-top:1px solid #31516f;display:flex;justify-content:center;padding:10px;z-index:10}.nav a{color:#fff;text-decoration:none;font-size:12px;text-align:center}.nav b{display:block;color:#d4af37;font-size:19px}@media(max-width:600px){h1{font-size:28px}}</style></head><body><div class="top"><div class="wrap" style="padding:0"><div class="brand">🚗 Daivik Doorstep</div></div></div><main class="wrap"><section class="card hero"><h1>📦 My Washes</h1><p class="muted">Your bookings, service status and live tracking.</p></section><section class="card"><div id="orders">Loading...</div></section></main><nav class="nav"><a href="./app.html"><b>⌂</b>Home</a></nav><script>const db=supabase.createClient("https://rgjymvvtrmzhznnreqog.supabase.co",atob("c2JfcHVibGlzaGFibGVfdmFfMjNHaWhNN0xNT2c3SjVMc2puZ19UUUFVR0N6WQ=="));let user=null;const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const recentEnough=o=>{const s=String(o.status||"").trim().toLowerCase();if(!["completed","cancelled","closed"].includes(s))return true;const at=o.completed_at||o.cancelled_at||o.updated_at||o.created_at;return Date.now()-new Date(at).getTime()<86400000};const canCancel=s=>["Booking Received","Confirmed"].includes(String(s||"").trim());async function cancelOrder(id){const o=window.customerOrders?.find(x=>x.order_id===id);if(!o||!canCancel(o.status))return;if(!confirm("Cancel order "+id+"?"))return;const{error}=await db.from("daivik_car_wash_orders").update({status:"Cancelled",cancelled_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("order_id",id).eq("customer_user_id",user.id).in("status",["Booking Received","Confirmed"]);if(error){alert("Cancellation failed: "+error.message);return}loadOrders()}async function loadOrders(){const r=await db.from("daivik_car_wash_orders").select("*").eq("customer_user_id",user.id).order("created_at",{ascending:false}).limit(50);if(r.error){$("orders").innerHTML='<p class="muted">Could not load orders: '+esc(r.error.message)+'</p>';return}const rows=(r.data||[]).filter(recentEnough).slice(0,20);window.customerOrders=rows;$("orders").innerHTML=rows.map(o=>{const cancel=canCancel(o.status)?'<button class="btn red" data-id="'+esc(o.order_id)+'" onclick="cancelOrder(this.dataset.id)">Cancel Order</button>':"";const track=!["Cancelled","Completed"].includes(String(o.status||""))?'<a class="btn blue" href="customer.html?order='+encodeURIComponent(o.order_id)+'#tracking">Track Wash</a>':"";return '<div class="item"><b>'+esc(o.order_id)+'</b> • <span class="gold">'+esc(o.status||"Booking Received")+'</span><div class="muted">'+esc(o.service)+' • ₹'+esc(o.price)+'</div><div class="muted">🚗 '+esc(o.vehicle)+' • 📅 '+esc(o.service_date)+' • '+esc(o.preferred_time||"")+'</div><div class="muted">📍 '+esc(o.address)+'</div><div class="muted">💳 '+esc(o.payment_method||"—")+' • Payment: '+esc(o.payment_status||"Pending")+'</div><div class="row" style="margin-top:10px">'+track+cancel+'</div></div>'}).join("")||'<p class="muted">No active or recent washes.</p>'}async function boot(){const s=await db.auth.getSession();if(!s.data.session){location.href="./customer.html";return}user=s.data.session.user;await loadOrders()}db.auth.onAuthStateChange((e,s)=>{if(e==="SIGNED_OUT")location.href="./customer.html"});boot();setInterval(()=>{if(user)loadOrders()},10000)</script></body></html>
